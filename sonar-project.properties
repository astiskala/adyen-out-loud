# SonarCloud configuration. This project's SonarCloud organization/project must be created by a
# human with SonarCloud admin access — see docs/development.md for the setup steps. Until
# sonar.projectKey/sonar.organization below are filled in with real values and a SONAR_TOKEN
# repository secret is added, .github/workflows/sonarcloud.yml will run but fail at the scan step.
sonar.projectKey=REPLACE_WITH_SONARCLOUD_PROJECT_KEY
sonar.organization=REPLACE_WITH_SONARCLOUD_ORG

sonar.sources=worker/src,app/AdyenOutLoud.Core,app/AdyenOutLoud
sonar.tests=worker/test,app/AdyenOutLoud.Tests
sonar.exclusions=worker/coverage/**,worker/worker-configuration.d.ts,artifacts/**,**/bin/**,**/obj/**

sonar.javascript.lcov.reportPaths=worker/coverage/lcov.info
