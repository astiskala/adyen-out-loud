name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker (lint, types, architecture, tests, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: worker/.node-version
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run quality
      - run: npm audit --audit-level=high
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-coverage
          path: worker/coverage
          retention-days: 14
          if-no-files-found: ignore

  dotnet:
    name: .NET (format, analyzers, architecture tests, unit tests, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Install the Android workload
        run: dotnet workload install android
      - name: Restore
        run: dotnet restore AdyenOutLoud.slnx
      - name: Format check
        run: dotnet format AdyenOutLoud.slnx --no-restore --verify-no-changes --verbosity diagnostic
      - name: Build (Core, Tests, ArchitectureTests, Android head)
        run: |
          dotnet build AdyenOutLoud.Core/AdyenOutLoud.Core.csproj --no-restore -c Release
          dotnet build AdyenOutLoud.Tests/AdyenOutLoud.Tests.csproj --no-restore -c Release
          dotnet build AdyenOutLoud.ArchitectureTests/AdyenOutLoud.ArchitectureTests.csproj --no-restore -c Release
          dotnet build AdyenOutLoud/AdyenOutLoud.csproj -f net10.0-android -c Release
      - name: Architecture tests
        run: dotnet test AdyenOutLoud.ArchitectureTests/AdyenOutLoud.ArchitectureTests.csproj --no-build -c Release
      - name: Unit tests with coverage (see docs/testing.md for thresholds)
        run: ../scripts/dotnet-coverage.sh
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-coverage
          path: artifacts/coverage/dotnet/report
          retention-days: 14
          if-no-files-found: ignore
