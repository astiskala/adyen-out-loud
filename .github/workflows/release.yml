name: Release

# Builds the downloadable app: an Android APK and a Windows installer (.exe) plus a portable Windows zip.
# - Pushing a tag like v1.2.3 creates a GitHub release for it with those files attached.
# - Running it by hand (Actions > Release > Run workflow) builds the same files as workflow artifacts only.
#
# Android signing: set the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD repository secrets so every release is signed with the same key (Android refuses to
# update an app signed with a different key). Without them the APK is signed with a throwaway debug key.
# Windows builds are not code-signed, so SmartScreen warns on first run (see docs/development.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ ! "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::Release tags must look like v1.2.3 (got $REF_NAME)."
              exit 1
            fi
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: |
          dotnet workload update
          dotnet workload install maui-android
      - name: Publish
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          signing=()
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            # env: makes MSBuild read the passwords from the environment, so they never appear in the log.
            signing=(-p:AndroidKeyStore=true "-p:AndroidSigningKeyStore=$RUNNER_TEMP/release.keystore"
              "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS"
              -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD)
          else
            echo "::warning::No Android signing key configured; the APK is signed with a throwaway debug key and cannot update an earlier install."
          fi
          dotnet publish AdyenOutLoud/AdyenOutLoud.csproj -f net10.0-android -c Release \
            -p:AndroidPackageFormat=apk \
            -p:ApplicationDisplayVersion="$VERSION" -p:ApplicationVersion="$GITHUB_RUN_NUMBER" \
            -o "$RUNNER_TEMP/android" "${signing[@]}"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$RUNNER_TEMP"/android/*-Signed.apk "$GITHUB_WORKSPACE/dist/AdyenOutLoud-$VERSION-android.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: |
          dotnet workload update
          dotnet workload install maui-android maui-windows
      - name: Publish (unpackaged, self-contained)
        run: |
          dotnet publish AdyenOutLoud/AdyenOutLoud.csproj -f net10.0-windows10.0.19041.0 -c Release \
            -p:RuntimeIdentifierOverride=win-x64 -p:WindowsPackageType=None \
            -p:WindowsAppSDKSelfContained=true -p:SelfContained=true \
            -p:ApplicationDisplayVersion="$VERSION" -p:ApplicationVersion="$GITHUB_RUN_NUMBER" \
            -o "$RUNNER_TEMP/windows"
          test -f "$RUNNER_TEMP/windows/AdyenOutLoud.exe"
      - name: Build the installer
        env:
          # Stop Git Bash rewriting ISCC's /D switches as paths (ISCC would see them as extra script files).
          MSYS_NO_PATHCONV: "1"
        run: |
          choco install innosetup --no-progress -y
          mkdir -p "$GITHUB_WORKSPACE/dist"
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/DAppVersion=$VERSION" \
            "/DSourceDir=$(cygpath -w "$RUNNER_TEMP/windows")" \
            "/DOutputDir=$(cygpath -w "$GITHUB_WORKSPACE/dist")" \
            Installer/AdyenOutLoud.iss
      - name: Zip the portable build
        shell: pwsh
        run: Compress-Archive -Path "$env:RUNNER_TEMP\windows\*" -DestinationPath "$env:GITHUB_WORKSPACE\dist\AdyenOutLoud-$env:VERSION-windows-x64-portable.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [version, android, windows]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Adyen Out Loud $TAG" --generate-notes
