version: 2
updates:
  - package-ecosystem: nuget
    directory: /app
    schedule:
      interval: weekly
    groups:
      maui-and-microsoft:
        patterns:
          - "Microsoft.*"
      test-tooling:
        patterns:
          - "xunit*"
          - "coverlet*"
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    groups:
      lint-and-format:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "typescript-eslint"
          - "prettier*"
      cloudflare:
        patterns:
          - "@cloudflare/*"
          - "wrangler"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
